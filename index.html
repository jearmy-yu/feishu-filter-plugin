<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Filter</title>
<script src="https://lf3-static.bytednsdoc.com/obj/eden-cn/ml-nj6l7vqol/vchart/plugin-sdk.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}#app{padding:12px;width:100%;height:100%}.filter-item{margin-bottom:12px}.filter-label{display:block;margin-bottom:4px}.filter-select{width:100%;padding:6px 8px;border:1px solid #ddd;border-radius:4px;outline:0}</style>
</head>
<body>
<div id="app"></div>
<script>
const plugin=window.useMultidbWidgetPlugin?.()||window.widgetPlugin;const app=document.getElementById("app");let currentData=null;plugin.mount({onConfigChange:config=>{currentData&&render(config,currentData)}});plugin.onDataReady(data=>{currentData=data;const config=plugin.getConfig()||{};render(config,data)});function render(config,data){app.innerHTML="";const{columns,rows}=data;const fields=config.fields||[];const isMulti=config.multiSelect!==false;const fontSize=config.fontSize||14;const bgColor=config.bgColor||"#fff";const textColor=config.textColor||"#333";const selectBg=config.selectBg||"#fff";const style=document.createElement("style");style.textContent=`#app{background:${bgColor}}.filter-label{font-size:${fontSize}px;color:${textColor}}.filter-select{font-size:${fontSize}px;background:${selectBg};color:${textColor}}`;document.head.appendChild(style);fields.forEach(field=>{const col=columns.find(c=>c.title===field);if(!col)return;const values=[...new Set(rows.map(r=>r[col.index]?.value||""))].filter(Boolean).sort();const item=document.createElement("div");item.className="filter-item";item.innerHTML=`<label class="filter-label">${field}</label><select class="filter-select" data-field="${field}" ${isMulti?"multiple":""}><option value="">全部</option>${values.map(v=>`<option value="${v}">${v}</option>`).join("")}</select>`;app.appendChild(item);const sel=item.querySelector(".filter-select");sel.addEventListener("change",applyFilter)});function applyFilter(){const selects=document.querySelectorAll(".filter-select");const filters=[];selects.forEach(sel=>{const field=sel.dataset.field;let vals=[];if(sel.multiple){vals=Array.from(sel.selectedOptions).map(o=>o.value).filter(Boolean)}else{if(sel.value)vals=[sel.value]}if(vals.length>0)filters.push({field,values:vals})});plugin.setFilter({filters})}}
</script>
</body>
</html>
